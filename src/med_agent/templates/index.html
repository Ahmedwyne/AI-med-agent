<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedAgent — AI Medical Research</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>MedAgent</span>
    </div>
    <div class="sidebar-section-label">Suggested</div>
    <div class="sidebar-examples">
      <button class="example-btn" data-query="What are the latest treatments for type 2 diabetes?">Type 2 diabetes treatments</button>
      <button class="example-btn" data-query="Summarize recent clinical trials for EGFR-mutant lung cancer">EGFR lung cancer trials</button>
      <button class="example-btn" data-query="What is the mechanism of action of metformin?">Metformin mechanism</button>
      <button class="example-btn" data-query="Evidence-based guidelines for hypertension management in elderly patients">Hypertension in elderly</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Medical Research Assistant</span>
      <span class="status-dot" id="status-dot" title="Online"></span>
    </header>

    <!-- Chat area -->
    <div class="chat-area" id="chat-area">
      <div class="welcome-state" id="welcome-state">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <h2>What can I help you research?</h2>
        <p>Ask about treatments, drug interactions, clinical trials, or medical guidelines. I'll search PubMed, ClinicalTrials.gov, and more.</p>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <form id="query-form" class="input-form">
        <div class="textarea-wrap">
          <textarea
            id="user-query"
            rows="1"
            placeholder="Ask a medical question… (Enter to send, Shift+Enter for new line)"
            autocomplete="off"
          ></textarea>
        </div>
        <button type="submit" id="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <p class="disclaimer">MedAgent provides research summaries, not medical advice. Always consult a physician.</p>
    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
